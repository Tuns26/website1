<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Einladung</title>
  <meta name="description" content="Unsere Hochzeitseinladung – wir freuen uns auf euch!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
</head>
<body>

  <!-- ======= 1. BRIEFUMSCHLAG (Intro) =======
       Die obere Papierklappe klappt mitsamt Siegel komplett nach oben auf
       (generiertes Video). Fallback: CSS-3D-Klappe aus dem Standbild. -->
  <div id="envelope" class="envelope" aria-label="Einladung öffnen" role="button" tabindex="0">
    <video id="envelopeVideo" class="envelope__video" muted playsinline preload="auto"></video>

    <!-- CSS-Fallback: Umschlag aus dem Standbild, obere Hälfte klappt hoch -->
    <div class="envelope__css" id="envelopeCss" aria-hidden="true">
      <div class="envelope__half envelope__half--bottom"></div>
      <div class="envelope__half envelope__half--top"></div>
    </div>

    <span class="envelope__hint">Tippen&nbsp;zum&nbsp;Öffnen</span>
    <div class="envelope__pulse" aria-hidden="true"></div>
  </div>

  <!-- Hintergrundmusik + Stummschalt-Button -->
  <audio id="bgMusic" loop preload="auto"></audio>
  <button id="musicToggle" class="music-toggle" type="button" aria-label="Musik stummschalten" hidden>
    <svg class="music-toggle__on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5L6.5 9H3v6h3.5L11 19z"/><path d="M15 9.5a4 4 0 010 5"/><path d="M17.5 7a7.5 7.5 0 010 10"/>
    </svg>
    <svg class="music-toggle__off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5L6.5 9H3v6h3.5L11 19z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>

  <!-- ======= EINLADUNG ======= -->
  <main id="invitation" class="invitation" hidden>

    <!-- 2. Hero: animiertes Aquarell – Blumen, Kolibris & Schmetterlinge -->
    <section class="hero" id="hero">
      <video class="hero__video" muted loop playsinline autoplay preload="auto"></video>
      <div class="hero__petals" aria-hidden="true"></div>
      <div class="hero__content">
        <p class="hero__announce" data-config="announcement"></p>
        <h1 class="hero__names">
          <span class="hero__name" data-config="nameOne"></span>
          <span class="hero__amp">&amp;</span>
          <span class="hero__name" data-config="nameTwo"></span>
        </h1>
        <p class="hero__date" data-config="dateDisplay"></p>
      </div>
      <a class="hero__cta" href="#welcome">
        <span>Entdecken</span>
        <svg class="hero__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </section>

    <!-- Weicher Übergang: Aquarell-Welle -->
    <div class="wave-divider" aria-hidden="true">
      <svg viewBox="0 0 1440 90" preserveAspectRatio="none"><path d="M0,40 C240,90 480,0 720,35 C960,70 1200,10 1440,45 L1440,90 L0,90 Z"/></svg>
    </div>

    <!-- 3. Countdown & Welcome -->
    <section class="welcome" id="welcome">
      <div class="countdown reveal">
        <div class="countdown__card">
          <h2 class="countdown__title" data-config="countdownTitle"></h2>
          <p class="countdown__until" data-config="countdownSubtitle"></p>
          <div class="countdown__rule" aria-hidden="true"></div>
          <div class="countdown__grid">
            <div class="countdown__tile"><span class="countdown__num" id="cdDays">0</span><span class="countdown__label">Tage</span></div>
            <div class="countdown__sep"></div>
            <div class="countdown__tile"><span class="countdown__num" id="cdHours">0</span><span class="countdown__label">Stunden</span></div>
            <div class="countdown__sep"></div>
            <div class="countdown__tile"><span class="countdown__num" id="cdMins">0</span><span class="countdown__label">Minuten</span></div>
          </div>
        </div>
      </div>

      <!-- animierte Blumengirlande -->
      <div class="garland reveal">
        <video class="garland__video" muted loop playsinline autoplay preload="auto"></video>
      </div>

      <div class="welcome__text reveal">
        <h2 class="script-heading" data-config="welcomeTitle"></h2>
        <p class="welcome__families" data-config="welcomeLine"></p>
        <p class="welcome__body" data-config="welcomeText"></p>
      </div>
    </section>

    <!-- 4. Ceremony & Reception -->
    <section class="ceremony" id="ceremony">
      <div class="ceremony__border" aria-hidden="true">
        <video class="ceremony__borderVideo" muted loop playsinline autoplay preload="auto"></video>
      </div>
      <div class="ceremony__panel reveal">
        <svg class="ceremony__panelShape" viewBox="0 0 400 620" preserveAspectRatio="none" aria-hidden="true">
          <path d="M200,8 C240,8 250,20 290,16 C330,12 340,30 370,38 C392,44 392,70 388,100 C384,130 394,160 392,200 L392,420 C394,460 384,490 388,520 C392,550 392,576 370,582 C340,590 330,608 290,604 C250,600 240,612 200,612 C160,612 150,600 110,604 C70,608 60,590 30,582 C8,576 8,550 12,520 C16,490 6,460 8,420 L8,200 C6,160 16,130 12,100 C8,70 8,44 30,38 C60,30 70,12 110,16 C150,20 160,8 200,8 Z"
                fill="var(--panel-fill)" stroke="var(--olive)" stroke-width="2.5"/>
          <path d="M200,20 C238,20 248,31 286,27 C322,23 332,40 359,47 C378,52 379,74 375,102 C371,131 381,161 379,200 L379,420 C381,459 371,489 375,518 C379,546 378,568 359,573 C332,580 322,597 286,593 C248,589 238,600 200,600 C162,600 152,589 114,593 C78,597 68,580 41,573 C22,568 21,546 25,518 C29,489 19,459 21,420 L21,200 C19,161 29,131 25,102 C21,74 22,52 41,47 C68,40 78,23 114,27 C152,31 162,20 200,20 Z"
                fill="none" stroke="var(--olive)" stroke-width="1"/>
        </svg>
        <div class="ceremony__content">
          <h2 class="script-heading script-heading--tight" data-config="ceremonyTitle"></h2>
          <div class="ceremony__rule" aria-hidden="true"></div>
          <p class="ceremony__where" data-config="ceremonyWhere"></p>
          <p class="ceremony__venue script-sub" data-config="locationName"></p>
          <p class="ceremony__city" data-config="locationCity"></p>
          <div class="ceremony__when">
            <span class="ceremony__day" data-config="ceremonyDay"></span>
            <span class="ceremony__time script-sub" data-config="ceremonyTime"></span>
          </div>
          <p class="ceremony__address" data-config="locationAddress"></p>
          <figure class="ceremony__venueArt">
            <img alt="Unsere Location als Aquarell" loading="lazy" />
          </figure>
          <div class="ceremony__actions">
            <a class="btn btn--outline" id="mapsLink" href="#" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 21s-7-5.1-7-11a7 7 0 1114 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
              In Maps öffnen
            </a>
            <a class="btn btn--outline" id="calendarLink" href="#">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
              Zum Kalender
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- 5. Das Wochenende / Am Vorabend -->
    <section class="weekend" id="weekend">
      <img class="weekend__emblem reveal" alt="" aria-hidden="true" />
      <h2 class="script-heading reveal" data-config="weekendTitle"></h2>
      <p class="caps-sub reveal" data-config="weekendSubtitle"></p>
      <div class="card reveal">
        <img class="card__flower card__flower--tr" alt="" aria-hidden="true" />
        <p class="card__venue script-sub" data-config="weekendVenue"></p>
        <p class="card__city" data-config="weekendCity"></p>
        <div class="card__when">
          <span class="card__day" data-config="weekendDay"></span>
          <span class="card__time script-sub" data-config="weekendTime"></span>
        </div>
        <p class="card__address" data-config="weekendAddress"></p>
        <a class="text-link" data-config-href="weekendMapsUrl" href="#" target="_blank" rel="noopener">Google&nbsp;Maps</a>
      </div>
    </section>

    <!-- 6. Unsere Geschichte -->
    <section class="story" id="story">
      <div class="story__butterflies reveal" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c-1-3-4-6-7-6-2 0-3 2-2 4 .8 1.7 3 3 5 3-2 .5-4 2-4.5 4-.4 1.8 1 3 2.5 2.5 2.5-.8 5-3.5 6-7.5zm0 0c1-3 4-6 7-6 2 0 3 2 2 4-.8 1.7-3 3-5 3 2 .5 4 2 4.5 4 .4 1.8-1 3-2.5 2.5-2.5-.8-5-3.5-6-7.5z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c-1-3-4-6-7-6-2 0-3 2-2 4 .8 1.7 3 3 5 3-2 .5-4 2-4.5 4-.4 1.8 1 3 2.5 2.5 2.5-.8 5-3.5 6-7.5zm0 0c1-3 4-6 7-6 2 0 3 2 2 4-.8 1.7-3 3-5 3 2 .5 4 2 4.5 4 .4 1.8-1 3-2.5 2.5-2.5-.8-5-3.5-6-7.5z"/></svg>
      </div>
      <h2 class="script-heading reveal" data-config="storyTitle"></h2>
      <button class="btn btn--solid reveal" id="storyToggle" type="button" data-config="storyButton"></button>
      <p class="story__text" id="storyText" hidden data-config="storyText"></p>
      <div class="story__track reveal" id="storyTrack" aria-label="Unsere Geschichte in Bildern"></div>
    </section>

    <!-- 7. Anreise -->
    <section class="travel" id="travel">
      <p class="caps-sub reveal" data-config="travelTitle"></p>
      <div class="card card--tall reveal">
        <img class="travel__deco" alt="" aria-hidden="true" />
        <div class="travel__item">
          <span class="travel__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M3 10h18M7 17v2M17 17v2"/><circle cx="7.5" cy="13.5" r="0.8"/><circle cx="16.5" cy="13.5" r="0.8"/></svg>
          </span>
          <h3 class="travel__heading script-sub" data-config="shuttleTitle"></h3>
          <p class="caps-sub caps-sub--small" data-config="shuttleWhen"></p>
          <p class="travel__text" data-config="shuttleText"></p>
        </div>
        <div class="travel__item">
          <span class="travel__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 13l1.5-4.5A2 2 0 017.4 7h9.2a2 2 0 011.9 1.5L20 13v5h-2.5v-1.5h-11V18H4v-5z"/><circle cx="7.5" cy="14.5" r="0.8"/><circle cx="16.5" cy="14.5" r="0.8"/></svg>
          </span>
          <h3 class="travel__heading script-sub" data-config="valetTitle"></h3>
          <p class="caps-sub caps-sub--small" data-config="valetWhere"></p>
          <p class="travel__text" data-config="valetText"></p>
        </div>
        <div class="card__rule" aria-hidden="true"></div>
        <p class="travel__note" data-config="travelNote"></p>
        <p class="card__address" data-config="travelAddress"></p>
        <a class="text-link" data-config-href="travelMapsUrl" href="#" target="_blank" rel="noopener">Google&nbsp;Maps</a>
      </div>
    </section>

    <!-- 8. Übernachten -->
    <section class="hotels" id="hotels">
      <p class="caps-sub reveal" data-config="hotelsTitle"></p>
      <p class="hotels__intro reveal" data-config="hotelsIntro"></p>
      <img class="hotels__bellhop reveal" alt="" aria-hidden="true" />
      <div class="card reveal">
        <p class="caps-sub caps-sub--small" data-config="hotelMainTag"></p>
        <p class="card__venue script-sub" data-config="hotelMainName"></p>
        <p class="card__address" data-config="hotelMainAddress"></p>
        <p class="caps-sub caps-sub--small" data-config="hotelMainDatesLabel"></p>
        <p class="hotels__value" data-config="hotelMainDates"></p>
        <p class="caps-sub caps-sub--small" data-config="hotelMainRatesLabel"></p>
        <p class="hotels__value" data-config="hotelMainRate1"></p>
        <p class="hotels__value" data-config="hotelMainRate2"></p>
        <p class="hotels__deadline" data-config="hotelMainDeadline"></p>
        <p class="hotels__reference" data-config="hotelMainReference"></p>
        <p class="hotels__value"><a class="plain-link" data-config-href="hotelMainPhoneHref" data-config="hotelMainPhone" href="#"></a></p>
        <a class="text-link" data-config-href="hotelMainMapsUrl" href="#" target="_blank" rel="noopener">Google&nbsp;Maps</a>
      </div>
      <img class="hotels__loungers reveal" alt="" aria-hidden="true" />
      <div class="card reveal">
        <p class="caps-sub caps-sub--small" data-config="hotelAltTag"></p>
        <p class="card__venue script-sub" data-config="hotelAltName"></p>
        <p class="card__address" data-config="hotelAltAddress"></p>
        <p class="hotels__value"><a class="plain-link" data-config-href="hotelAltPhoneHref" data-config="hotelAltPhone" href="#"></a></p>
        <a class="text-link" data-config-href="hotelAltMapsUrl" href="#" target="_blank" rel="noopener">Google&nbsp;Maps</a>
      </div>
    </section>

    <!-- 9. Dresscode & Tagesprogramm -->
    <section class="dresscode" id="dresscode">
      <h2 class="script-heading reveal" data-config="dresscodeTitle"></h2>
      <p class="dresscode__code reveal" data-config="dresscodeText"></p>
      <img class="dresscode__guests reveal" alt="Festliche Gäste als Aquarell" loading="lazy" />
    </section>

    <section class="programme" id="programme">
      <h2 class="script-heading reveal" data-config="programmeTitle"></h2>
      <div class="programme__frame reveal">
        <img class="programme__frameImg" alt="" aria-hidden="true" />
        <ol class="programme__list" id="programmeList"></ol>
      </div>
    </section>

    <!-- Fußzeile -->
    <footer class="footer">
      <svg class="footer__bird" viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <path d="M8 22c8-2 14-8 17-16 2 6 1 11-1 15 6-2 12-1 16 2-5 1-8 3-10 6 8 0 14 2 18 7-10-2-19-1-26 3-6 3-12 2-16-3 3-1 5-3 6-6-2-1-4-3-4-8z"/>
      </svg>
      <p class="footer__names"><span data-config="nameOne"></span> &amp; <span data-config="nameTwo"></span></p>
      <p class="footer__text" data-config="footerText"></p>
    </footer>
  </main>

  <script src="js/config.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
